<html lang="en"> 
<head> 
  <meta charset="UTF-8"> 
  <title>Hey_Lucky</title> 
  <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cxh.pages.dev/style.css">
  <script src="//content.jwplatform.com/libraries/SAHhwvZq.js"></script> 
  <style> 
    body { margin: 0; } 
    .jwplayer { position: absolute !important; } 
    .jwplayer.jw-flag-aspect-mode { 
      min-height: 100%; 
      max-height: 100%; 
    } 

    
      
  </style> 
</head> 
<body> 
  <div id="jwplayerDiv"></div> 

  

  <script> 
    function getQueryParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    function closePopup() {
        document.getElementById("telegramPopup").style.display = "none";
        loadVideo();
    }

    function loadVideo() {
        const videoUrl = getQueryParam("url"); 

        if (videoUrl) {
            jwplayer("jwplayerDiv").setup({ 
                file: videoUrl, 
                position: 'bottom', 
                autostart: true, 
                stretching: "uniform", 
                width: "100%", 
                type: videoUrl.endsWith('.mpd') ? "dash" : "hls"
            }); 
        } else {
            document.getElementById("jwplayerDiv").innerHTML = "<p style='color:red; text-align:center;'>No video URL provided!</p>";
        }
    }
  </script> 
</body> 
</html>
